name: Update daily English quote

on:
  schedule:
    # 北京时间 08:17 更新，12:17 补试；当天已有内容时不重复获取。
    - cron: '17 0,4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-quote
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test tests/daily-quote*.test.ts
      - run: node --experimental-strip-types scripts/update-daily-quote.ts
      - name: Commit snapshot and dispatch React build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- data/daily-quote.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/daily-quote.json
            git commit -m "Update daily English quote"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN 的提交不会自动触发 Pages，需显式请求构建。
          # 即便快照未变化也请求构建，让补试可恢复前一次失败的发布。
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" -f ref=main
