<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>小鹦鹉 · 学习伙伴</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffdf8;color:#29452d;font:16px system-ui}main{max-width:1120px;margin:36px auto;padding:24px}h1{margin:0 0 8px;font-size:30px}p{color:#708173;margin:0 0 24px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}article{background:white;border:1px solid #e2eadb;border-radius:24px;overflow:hidden;text-align:center;padding-bottom:20px}h2{font-size:18px;margin:0}article p{font-size:13px;margin:6px 0 0}.bird{width:100%;aspect-ratio:1}footer{display:flex;gap:16px;align-items:center;margin-top:26px}button{background:#e5f5d5;border:1px solid #b7d496;border-radius:12px;padding:10px 20px;color:inherit;font:inherit;cursor:pointer}input{flex:1}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
</style><main><h1>小鹦鹉 · 学习伙伴</h1><p>欢迎挥翅、阅读翻页、侧耳聆听、举卡讲解、完成庆祝</p><section class="cards"></section><footer><button id="toggle">播放全部</button><input id="frame" aria-label="动画进度" type="range" min="0" max="287" value="100"><output>1.67 秒</output></footer></main><script src="lottie.min.js"></script><script>
const poses=[['wave','欢迎','挥翅打招呼'],['reading','阅读','低头看书 · 翻页'],['listening','聆听','侧耳听音 · 眨眼'],['teaching','讲解','展示字母 · 指引'],['cheer','庆祝','双翅欢呼 · 尾羽轻摆']];
const players=[];let playing=false;const frame=document.querySelector('#frame'),toggle=document.querySelector('#toggle');
for(const [id,title,desc]of poses){const article=document.createElement('article');article.innerHTML=`<div class="bird" id="${id}"></div><h2>${title}</h2><p>${desc}</p>`;document.querySelector('.cards').append(article);const p=lottie.loadAnimation({container:article.firstChild,renderer:'svg',loop:true,autoplay:false,path:id+'.json'});p.addEventListener('DOMLoaded',()=>p.goToAndStop(+frame.value,true));players.push(p)}
frame.addEventListener('input',()=>{playing=false;toggle.textContent='播放全部';players.forEach(p=>p.goToAndStop(+frame.value,true));document.querySelector('output').textContent=(frame.value/60).toFixed(2)+' 秒'});
toggle.onclick=()=>{playing=!playing;players.forEach(p=>playing?p.play():p.pause());toggle.textContent=playing?'暂停全部':'播放全部'};
</script></html>
