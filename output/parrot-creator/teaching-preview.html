<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>绿色鹦鹉 · 举卡讲解</title><style>body{margin:0;background:#f6f5ef;color:#294a34;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:760px;max-width:95vw;text-align:center}h1{font-size:24px;margin:20px 0 6px}p{color:#71806f}#animation{width:512px;height:512px;max-width:90vw;margin:auto;background:#fffdf8;border-radius:30px}button{background:#e5f1d5;border:1px solid #b4cf98;border-radius:12px;padding:12px 24px;font:inherit;color:#294a34;margin:16px 5px;cursor:pointer}input{width:370px;accent-color:#6eaa38}small{display:block;margin:16px;color:#71806f}</style><main><h1>绿色鹦鹉 · 举卡讲解</h1><p>举起卡片 → 正面展示 → 自然放下</p><div id="animation"></div><button id="toggle">暂停</button><button id="restart">重播</button><div><label for="frame">时间</label> <input id="frame" type="range" min="0" max="287" value="0"><output id="time">0.00 s</output></div><small>字母卡片与翅尖联动 · 4.8 秒循环</small></main><script src="lottie.min.js"></script><script>const a=lottie.loadAnimation({container:document.querySelector('#animation'),renderer:'svg',loop:true,autoplay:true,path:'teaching-v2.json'});let playing=true;let slider=document.querySelector('#frame'),toggle=document.querySelector('#toggle');toggle.onclick=()=>{playing=!playing;playing?a.play():a.pause();toggle.textContent=playing?'暂停':'播放'};document.querySelector('#restart').onclick=()=>{a.goToAndPlay(0,true);playing=true;toggle.textContent='暂停'};slider.oninput=()=>{a.goToAndStop(+slider.value,true);playing=false;toggle.textContent='播放'};a.addEventListener('enterFrame',e=>{slider.value=Math.round(e.currentTime);document.querySelector('#time').value=(e.currentTime/60).toFixed(2)+' s'});</script></html>
